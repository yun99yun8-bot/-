<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torn计算</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="page-tabs" aria-label="页面导航">
      <button id="tornTab" class="active">Torn计算</button>
      <button id="historyTab">历史数据</button>
    </nav>

    <main class="content">
      <section class="card stats-card">
        <div class="section-title">数据统计</div>
        <div class="prob-grid">
          <div class="prob-item">单3<small>次数：--次</small><small>概率：--%</small></div>
          <div class="prob-item">单4<small>次数：--次</small><small>概率：--%</small></div>
          <div class="prob-item">单5<small>次数：--次</small><small>概率：--%</small></div>
          <div class="prob-item">单2<small>次数：--次</small><small>概率：--%</small></div>
          <div class="prob-item">单0<small>次数：--次</small><small>概率：--%</small></div>
          <div class="prob-item">单7<small>次数：--次</small><small>概率：--%</small></div>
          <div class="prob-item">单1<small>次数：--次</small><small>概率：--%</small></div>
          <div class="prob-item">单6<small>次数：--次</small><small>概率：--%</small></div>
        </div>
        <div class="conclusion">结论：<strong>单--</strong> 为最高概率</div>
      </section>

      <section class="card hero-card">
        <div class="result-head">
          <div class="section-title">开奖结果</div>
          <div class="period-badge">第 <strong>0000</strong> 期</div>
        </div>
        <div class="result-grid" aria-label="七个开奖结果">
          <div class="result-box">--</div>
          <div class="result-box">--</div>
          <div class="result-box">--</div>
          <div class="result-box">--</div>
          <div class="result-box">--</div>
          <div class="result-box">--</div>
          <div class="result-box">--</div>
        </div>
      </section>

      <section class="card">
        <div class="section-title">遗漏统计</div>
        <div class="omission-grid">
          <div class="stat">单0<small>--期</small></div>
          <div class="stat">单1<small>--期</small></div>
          <div class="stat">单2<small>--期</small></div>
          <div class="stat">单3<small>--期</small></div>
          <div class="stat">单4<small>--期</small></div>
          <div class="stat">单5<small>--期</small></div>
          <div class="stat">单6<small>--期</small></div>
          <div class="stat">单7<small>--期</small></div>
        </div>
      </section>

      <section class="card">
        <div class="section-title">20期区块数据</div>
        <div class="placeholder table-placeholder">等待数据</div>
      </section>
    </main>
  </div>
<script>
  const tornTab=document.getElementById('tornTab');
  const historyTab=document.getElementById('historyTab');
  function selectTab(active){
    tornTab.classList.toggle('active', active===tornTab);
    historyTab.classList.toggle('active', active===historyTab);
  }
  tornTab.addEventListener('click',()=>selectTab(tornTab));
  historyTab.addEventListener('click',()=>selectTab(historyTab));
</script>
</body>
</html>
