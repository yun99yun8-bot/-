<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TRON 历史采集</title><link rel="stylesheet" href="/style.css"></head><body><div class="app"><header><strong>TRON 历史采集 V10.4</strong></header><main><section class="card"><h1>只做一件事：获取10000期历史开奖</h1><p class="muted">先高速保存约20万组真实 TRON 历史区块，再从本地数据库按360规则重建10000期。无AI训练、无遗漏、无首页开奖记录、无新数据预测。</p></section><section class="card"><h2>① 20万组原始区块</h2><div class="single" id="raw">初始化…</div><p class="muted" id="rawDetail"></p></section><section class="card"><h2>② 10000期历史回填</h2><div class="single" id="periods">等待原始区块完成…</div><p class="muted" id="periodDetail"></p></section><section class="card"><h2>运行状态</h2><p id="status">读取中…</p><p class="muted">抓取失败会自动重试；已保存区块不会重复下载。较旧期号与区块的对应仍沿用现有360规则。</p></section></main></div><script>
const $=id=>document.getElementById(id); async function load(){try{const r=await fetch('/api/status',{cache:'no-store'}),d=await r.json();if(!d.ok)throw Error(d.message||'读取失败');if(!d.initialized){$('status').textContent='后台正在初始化';return}let a=d.raw,p=d.periods;$('raw').textContent=`${a.stored.toLocaleString()} / ${a.target.toLocaleString()} 组（${a.percent}%）`;$('rawDetail').textContent=`区块 ${a.startBlock} ～ ${a.endBlock}｜状态 ${a.status}｜失败批次 ${a.failedBatches}${a.error?'｜'+a.error:''}`;$('periods').textContent=`${p.rebuilt.toLocaleString()} / ${p.target.toLocaleString()} 期（${p.percent}%）`;$('periodDetail').textContent=`范围 ${p.start} ～ ${p.end}｜新回填 ${p.fetched}｜已有 ${p.existing}｜失败 ${p.failed}${p.error?'｜'+p.error:''}`;$('status').textContent=a.status==='complete'?(p.status==='complete'?'全部完成':'20万组已完成，正在本地重建10000期'):'正在高速抓取历史TRON区块';}catch(e){$('status').textContent='读取失败：'+e.message}}load();setInterval(load,2000);
</script></body></html>
