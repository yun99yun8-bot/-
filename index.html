<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>V10.5 历史采集</title><link rel="stylesheet" href="/style.css?v=105"></head>
<body><main class="wrap">
<section class="hero"><div class="ver">V10.5 · 纯采集版</div><h1>TRON 10000期历史数据采集</h1><p>只执行：抓取约20万组真实历史区块 → 按360规则回填10000期。</p></section>
<section class="card"><div class="head"><h2>20万组 TRON 原始数据</h2><b id="rawPct">0%</b></div><div class="big" id="raw">初始化…</div><div class="bar"><i id="rawBar"></i></div><p id="rawDetail">等待后台启动</p></section>
<section class="card"><div class="head"><h2>360规则历史回填</h2><b id="periodPct">0%</b></div><div class="big" id="periods">0 / 10,000 期</div><div class="bar"><i id="periodBar"></i></div><p id="periodDetail">原始区块完成后自动开始</p></section>
<section class="card status"><h2>当前状态</h2><div id="status">正在连接数据库…</div><p>页面每2秒自动刷新。失败批次会自动重试，已经保存的区块不会重复下载。</p></section>
</main><script>
const $=x=>document.getElementById(x);const pct=n=>Math.max(0,Math.min(100,Number(n)||0));
async function load(){try{const r=await fetch('/api/status?ts='+Date.now(),{cache:'no-store'}),d=await r.json();if(!d.ok)throw Error(d.message||'读取失败');if(!d.initialized){$('status').textContent='后台正在初始化采集任务';return}const a=d.raw,p=d.periods,ap=pct(a.percent),pp=pct(p.percent);$('raw').textContent=`${Number(a.stored).toLocaleString()} / ${Number(a.target).toLocaleString()} 组`;$('rawPct').textContent=ap.toFixed(2)+'%';$('rawBar').style.width=ap+'%';$('rawDetail').textContent=`区块 ${a.startBlock} ～ ${a.endBlock}｜失败批次 ${a.failedBatches}${a.error?'｜'+a.error:''}`;$('periods').textContent=`${Number(p.rebuilt).toLocaleString()} / ${Number(p.target).toLocaleString()} 期`;$('periodPct').textContent=pp.toFixed(2)+'%';$('periodBar').style.width=pp+'%';$('periodDetail').textContent=`${p.start} ～ ${p.end}｜新回填 ${p.fetched}｜已有 ${p.existing}｜失败 ${p.failed}${p.error?'｜'+p.error:''}`;$('status').textContent=a.status==='complete'?(p.status==='complete'?'✅ 20万组与10000期全部完成':'20万组抓取完成，正在本地回填10000期'):'正在高速抓取 TRON 历史区块';}catch(e){$('status').textContent='读取失败：'+e.message}}
load();setInterval(load,2000);
</script></body></html>
