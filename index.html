<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torn计算</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="page-tabs" aria-label="页面导航">
      <button id="tornTab" class="active">Torn计算</button>
      <button id="historyTab">历史数据</button>
    </nav>

    <main class="content" id="tornContent">
      <section class="card stats-card">
        <div class="section-title">数据统计</div>
        <div class="prob-grid">
          <div class="prob-item">单3<small>次数：--次</small><small>概率：--%</small></div>
          <div class="prob-item">单4<small>次数：--次</small><small>概率：--%</small></div>
          <div class="prob-item">单5<small>次数：--次</small><small>概率：--%</small></div>
          <div class="prob-item">单2<small>次数：--次</small><small>概率：--%</small></div>
          <div class="prob-item">单0<small>次数：--次</small><small>概率：--%</small></div>
          <div class="prob-item">单7<small>次数：--次</small><small>概率：--%</small></div>
          <div class="prob-item">单1<small>次数：--次</small><small>概率：--%</small></div>
          <div class="prob-item">单6<small>次数：--次</small><small>概率：--%</small></div>
        </div>
        <div class="conclusion">结论：<strong>单--</strong> 为最高概率</div>
      </section>

      <section class="card hero-card">
        <div class="result-head">
          <div class="section-title">开奖结果</div>
          <div class="draw-meta">
            <span class="single-badge">单<strong id="singleValue">--</strong></span>
            <span class="period-badge">第 <strong id="periodValue">0000000000</strong> 期<br><small>区块：<span id="blockValue">--</span></small></span>
          </div>
        </div>
        <div class="result-grid" aria-label="七个开奖结果">
          <div class="result-box" data-result="0">--</div>
          <div class="result-box" data-result="1">--</div>
          <div class="result-box" data-result="2">--</div>
          <div class="result-box" data-result="3">--</div>
          <div class="result-box" data-result="4">--</div>
          <div class="result-box" data-result="5">--</div>
          <div class="result-box" data-result="6">--</div>
        </div>
      </section>

      <section class="card">
        <div class="section-title">遗漏统计</div>
        <div class="omission-grid">
          <div class="stat">单0<small>--期</small></div>
          <div class="stat">单1<small>--期</small></div>
          <div class="stat">单2<small>--期</small></div>
          <div class="stat">单3<small>--期</small></div>
          <div class="stat">单4<small>--期</small></div>
          <div class="stat">单5<small>--期</small></div>
          <div class="stat">单6<small>--期</small></div>
          <div class="stat">单7<small>--期</small></div>
        </div>
      </section>

      <section class="card">
        <div class="section-title">20期区块数据</div>
        <div class="placeholder table-placeholder">等待数据</div>
      </section>
    </main>
    <main class="content" id="historyContent" hidden>
      <section class="card history-section">
        <div class="section-title">一、模仿预测</div>
        <div class="placeholder">内容占位</div>
      </section>

      <section class="card history-section">
        <div class="section-title">二、历史开奖记录</div>
        <div class="placeholder table-placeholder">内容占位</div>
      </section>

      <section class="card history-section">
        <div class="section-title">三、历史预判记录</div>
        <div class="placeholder table-placeholder">内容占位</div>
      </section>
    </main>
  </div>
<script>
  const tornTab=document.getElementById('tornTab');
  const historyTab=document.getElementById('historyTab');
  const tornContent=document.getElementById('tornContent');
  const historyContent=document.getElementById('historyContent');
  function selectTab(active){
    const isTorn=active===tornTab;
    tornTab.classList.toggle('active', isTorn);
    historyTab.classList.toggle('active', !isTorn);
    tornContent.hidden=!isTorn;
    historyContent.hidden=isTorn;
  }
  tornTab.addEventListener('click',()=>selectTab(tornTab));
  historyTab.addEventListener('click',()=>selectTab(historyTab));

  async function loadDraw(){
    try{
      const res=await fetch('/api/draw',{cache:'no-store'});
      const data=await res.json();
      if(!data.ok) throw new Error(data.error||'开奖数据获取失败');
      document.getElementById('periodValue').textContent=data.platformPeriod || data.period || '0000000000';
      document.getElementById('singleValue').textContent=(data.singleCount ?? '--');
      document.querySelectorAll('[data-result]').forEach((el,i)=>{el.textContent=(data.numbers&&data.numbers[i])||'--';});
      document.getElementById('blockValue').textContent=data.blockNumber??'--';
    }catch(err){
      console.error(err);
    }
  }
  loadDraw();
  setInterval(loadDraw, 15000);
</script>
</body>
</html>
