<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Torn 开奖记录</title><link rel="stylesheet" href="/style.css"></head><body><div class="app">
<header><strong>Torn 记录</strong><nav><button id="currentTab" class="active">开奖结果</button><button id="historyTab">历史记录</button><a href="/research-report">练习报告 ↗</a></nav></header>
<main id="currentPanel"><section class="card"><div class="row"><h1>最近开奖结果</h1><span id="liveStatus">读取中…</span></div><p class="period" id="latestPeriod">等待确认</p><div class="balls" id="latestNumbers"></div><p class="single" id="latestSingle">单—</p><p class="muted" id="latestBlock"></p><p class="muted" id="currentPeriod"></p></section>
<section class="card"><h2>当前遗漏</h2><div class="gaps" id="omission"></div><p class="muted" id="omissionThrough">等待已确认的开奖结果…</p></section>
<section class="card"><div class="row"><h2>最近20期</h2><button class="refresh" onclick="loadLive()">刷新</button></div><div id="recent" class="recent"></div></section></main>
<main id="historyPanel" hidden><section class="card"><div class="row"><h1>历史开奖记录</h1><span class="muted">按期号倒序</span></div><div class="scroll"><table><thead><tr><th>期号</th><th>开奖号码</th><th>单几</th><th>区块</th></tr></thead><tbody id="historyRows"></tbody></table></div><button class="more" id="loadMore">加载更早记录</button></section></main>
</div><script>
const red=new Set('01 02 07 08 12 13 18 19 23 24 29 30 34 35 40 45 46'.split(' ')),green=new Set('05 06 11 16 17 21 22 27 28 32 33 38 39 43 44 49'.split(' '));
function e(value){return String(value??'—').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));}
function balls(nums){return (nums||[]).map(v=>{const n=String(v).padStart(2,'0');return `<span class="ball ${red.has(n)?'red':green.has(n)?'green':'blue'}">${e(n)}</span>`}).join('')||'<span class="muted">等待开奖结果</span>';}
function show(tab){const current=tab==='current';document.getElementById('currentPanel').hidden=!current;document.getElementById('historyPanel').hidden=current;document.getElementById('currentTab').classList.toggle('active',current);document.getElementById('historyTab').classList.toggle('active',!current);if(!current && !document.getElementById('historyRows').children.length)loadHistory();}
document.getElementById('currentTab').onclick=()=>show('current');document.getElementById('historyTab').onclick=()=>show('history');
async function loadLive(){try{let res=await fetch('/api/live',{cache:'no-store'}),d=await res.json();if(!d.ok)throw Error(d.message||'暂不可用');const l=d.latest;
document.getElementById('liveStatus').textContent='已连接';document.getElementById('latestPeriod').textContent=l?'第 '+l.platformPeriod+' 期':'等待开奖结果';document.getElementById('latestNumbers').innerHTML=balls(l?.numbers);
document.getElementById('latestSingle').textContent=l?'单'+l.single:'单—';document.getElementById('latestBlock').textContent=l?'区块：'+l.blockNumber:'';document.getElementById('currentPeriod').textContent='正在采集：第 '+d.currentPeriod+' 期';
document.getElementById('omission').innerHTML=Array.from({length:8},(_,i)=>`<div class="gap">单${i}<strong>${d.omission?.[String(i)]??'—'}</strong><small>期未出现</small></div>`).join('');document.getElementById('omissionThrough').textContent='遗漏统计截至 '+(d.omissionThrough||'待处理');
document.getElementById('recent').innerHTML=(d.history||[]).map(x=>`<div><span>${e(x.platformPeriod)}</span><strong>单${e(x.single)}</strong></div>`).join('')||'<p class="muted">暂无已确认记录</p>';
}catch(err){document.getElementById('liveStatus').textContent='读取失败：'+err.message;}}
let before='',busy=false;async function loadHistory(){if(busy)return;busy=true;let btn=document.getElementById('loadMore');btn.textContent='正在读取…';try{let url='/api/history?limit=50'+(before?'&before='+encodeURIComponent(before):'');let res=await fetch(url,{cache:'no-store'}),d=await res.json();if(!d.ok)throw Error(d.message||'读取失败');document.getElementById('historyRows').insertAdjacentHTML('beforeend',(d.rows||[]).map(x=>`<tr><td>${e(x.platformPeriod)}</td><td><div class="table-balls">${balls(x.numbers)}</div></td><td>单${e(x.single)}</td><td>${e(x.blockNumber)}</td></tr>`).join(''));before=d.nextBefore||'';btn.hidden=!before;btn.textContent='加载更早记录';if(!d.rows.length&&!document.getElementById('historyRows').children.length)btn.textContent='暂无历史记录';}catch(err){btn.textContent='重试：'+err.message;}busy=false;}
document.getElementById('loadMore').onclick=loadHistory;loadLive();setInterval(()=>{if(!document.hidden)loadLive()},2000);
</script></body></html>
