<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>V10.6.3 采集</title><link rel="stylesheet" href="/style.css?v=1051"></head><body><main class="wrap">
<section class="hero"><div class="ver">V10.6.3 · 先抓20万 + 新数据暂停原始数据不漏 + 再回填</div><h1>TRON 数据采集</h1><p>主任务：20万组历史区块 → 360规则 → 10000期；同时保留新产生的完整期。</p></section>
<section class="card"><div class="head"><h2>20万组历史原始数据</h2><b id="rawPct">0%</b></div><div class="big" id="raw">初始化…</div><div class="bar"><i id="rawBar"></i></div><p id="rawDetail">等待后台启动</p></section>
<section class="card"><div class="head"><h2>360规则历史回填</h2><b id="periodPct">0%</b></div><div class="big" id="periods">0 / 10,000 期</div><div class="bar"><i id="periodBar"></i></div><p id="periodDetail">原始区块完成后自动开始</p></section>
<section class="card"><h2>当前遗漏</h2><div class="om" id="om"></div></section>
<section class="card"><h2>最近开奖记录</h2><div id="recent">暂无</div></section>
<section class="card status"><h2>当前状态</h2><div id="status">正在连接数据库…</div><p>历史下载与新数据暂停补采同时运行；新数据暂停期优先，完成期写入后自动更新遗漏。</p></section>
</main><script>
const $=x=>document.getElementById(x),pct=n=>Math.max(0,Math.min(100,Number(n)||0));
function renderRecent(rows){$('recent').innerHTML=(rows||[]).map(r=>`<div class="row"><b>${r.periodKey}</b><span>${(r.numbers||[]).join(' · ')}</span><strong>单${r.single}</strong><small>区块 ${r.blockNumber}</small></div>`).join('')||'暂无'}
async function load(){try{const r=await fetch('/api/status?ts='+Date.now(),{cache:'no-store'}),d=await r.json();if(!d.ok)throw Error(d.message||'读取失败');$('om').innerHTML=Object.entries(d.omission||{}).map(([k,v])=>`<div><span>单${k}</span><b>${v}</b><small>期未出现</small></div>`).join('');renderRecent(d.recent);if(!d.initialized){$('status').textContent='后台正在初始化历史任务；新数据暂停补采已独立运行';return}const a=d.raw,p=d.periods,ap=pct(a.percent),pp=pct(p.percent);$('raw').textContent=`${Number(a.stored).toLocaleString()} / ${Number(a.target).toLocaleString()} 组`;$('rawPct').textContent=ap.toFixed(2)+'%';$('rawBar').style.width=ap+'%';$('rawDetail').textContent=`失败批次 ${a.failedBatches}${a.error?'｜'+a.error:''}`;$('periods').textContent=`${Number(p.rebuilt).toLocaleString()} / ${Number(p.target).toLocaleString()} 期`;$('periodPct').textContent=pp.toFixed(2)+'%';$('periodBar').style.width=pp+'%';$('periodDetail').textContent=`新回填 ${p.fetched}｜已有 ${p.existing}｜失败 ${p.failed}${p.error?'｜'+p.error:''}`;$('status').textContent=a.status==='complete'?(p.status==='complete'?'✅ 历史10000期完成；新数据暂停采集继续运行':'20万组完成，正在本地回填；新数据暂停采集继续运行'):'正在高速抓历史区块；新数据暂停新开奖同时补采';}catch(e){$('status').textContent='读取失败：'+e.message}}
load();setInterval(load,2500);
</script></body></html>
