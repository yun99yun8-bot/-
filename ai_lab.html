<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>AI实验结果</title><link rel="stylesheet" href="/style.css?v=8051"></head><body><main class="wrap">
<section class="hero"><div class="ver">v8god 0.0.5 AI训练完整版</div><h1>AI实验结果</h1><p>≥80%可采用，但训练不会自动停止；继续研究95%+。所有成绩以时间顺序样本外验证为主。</p></section>
<section class="card"><div class="head"><h2>训练状态</h2><b id="state">读取中</b></div><div id="summary" class="strategyBox"></div><p><button onclick="ctl('adopt')">采用当前AI</button> <button onclick="ctl('stop')">停止训练</button> <button onclick="ctl('resume')">继续训练</button></p><div class="notice warn">“达到80%/95%”不是保证；如果样本外验证没有达到，页面会显示真实最高成绩。</div></section>
<section class="card"><h2>当前两套综合AI</h2><div id="schemes"></div></section>
<section class="card"><h2>哈希数值分析</h2><div id="hash"></div></section>
<section class="card"><h2>方法成绩</h2><div class="scroll"><table><thead><tr><th>方法</th><th>命中</th><th>样本</th><th>命中率</th></tr></thead><tbody id="methods"></tbody></table></div></section>
<section class="card"><h2>交接0.0.6</h2><div id="handoff" class="strategyBox"></div></section>
</main><script>
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{let d=await (await fetch('/api/ai-lab?ts='+Date.now(),{cache:'no-store'})).json();if(!d.ok)throw Error(d.message);let l=d.lab,h=l.handoff||{},ss=h.schemes||[];$('state').textContent=l.trainingEnabled?'训练中':'已暂停';$('summary').innerHTML=`<b>历史最佳样本外命中率 ${l.bestAccuracy}%</b><p>最佳轮次 ${l.bestRound||'-'} ｜ 当前采用轮次 ${l.adoptedRound||'-'}</p><p>80%使用线：${l.usable?'已达到，可使用并继续训练':'未达到，仍可人工采用当前AI'} ｜ 95%研究目标：${l.targetReached?'已达到，仍可继续研究':'继续研究中'}</p>`;$('schemes').innerHTML=ss.map(x=>`<div class="row"><b>${esc(x.name)}</b><strong>样本外 ${x.holdoutAccuracy}%</strong><small>${x.hits}/${x.total} ｜ 样本外数 ${x.holdoutTotal}</small></div>`).join('')||'等待10000期训练';let rep=(h&&h.bestScheme)?((l.adoptedReport&&Object.keys(l.adoptedReport).length)?l.adoptedReport:{}):{};let hs=(rep.hashAnalysis||{});$('hash').innerHTML=`<p>${hs.enabled?'已启用':'等待训练'}</p><p>${esc((hs.methods||[]).join(' / '))}</p><small>${esc(hs.rule||'哈希方法成绩会与其他方法一起进入训练报告。')}</small>`;$('methods').innerHTML=(h.topMethods||[]).map(x=>`<tr><td>${esc(x.method)}</td><td>${x.hits}</td><td>${x.total}</td><td><b>${x.accuracy}%</b></td></tr>`).join('');$('handoff').innerHTML=`<b>${h.ready?'10000期已锁定':'等待10000期'}</b><p>数据集 ${(h.dataset||{}).start||'-'} → ${(h.dataset||{}).end||'-'}</p><p>0.0.6读取服务器冠军/采用AI，不需要重新训练。</p>`}catch(e){$('state').textContent='读取失败：'+e.message}}
async function ctl(action){if((action==='stop'||action==='adopt')&&!confirm(action==='stop'?'只停止AI训练，采集/开奖继续。确认？':'采用当前训练结果作为当前AI？训练仍会继续。'))return;let d=await (await fetch('/api/ai-training/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})})).json();if(!d.ok)alert(d.message||'操作失败');load()}load();setInterval(load,5000);
</script></body></html>
