services:
  - type: web
    name: tron-monitor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 45
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RUN_EMBEDDED_WORKERS
        value: "0"

  - type: worker
    name: tron-monitor-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WORKER_SERVICE_NAME
        value: tron-monitor-worker

  - type: worker
    name: tron-monitor-ai-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python ai_worker.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AI_WORKER_SERVICE_NAME
        value: tron-monitor-ai-worker
